<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.İO</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1b1b1b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        /* ANA MENÜ STİLLERİ */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .title-container {
            position: relative;
            margin-bottom: 40px;
            text-align: center;
        }
        h1.game-title {
            color: #FFEB3B;
            font-size: 80px;
            margin: 0;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);
            letter-spacing: 4px;
        }
        .slant-text-1 {
            position: absolute;
            top: -30px;
            left: -120px;
            color: #aaa;
            font-size: 13px;
            transform: rotate(45deg);
            white-space: nowrap;
            font-weight: bold;
        }
        .slant-text-2 {
            position: absolute;
            top: 20px;
            left: -180px;
            color: #aaa;
            font-size: 13px;
            transform: rotate(-45deg);
            white-space: nowrap;
            font-weight: bold;
        }
        .menu-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .menu-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        .menu-btn.settings {
            background-color: #555;
        }
        .menu-btn.settings:hover {
            background-color: #666;
        }

        /* OYUN İÇİ ARAYÜZ (HUD) */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        /* ENVANTER (Mavi Arka Plan) */
        #inventory-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(21, 101, 192, 0.9);
            border: 3px solid #0D47A1;
            border-radius: 12px;
            padding: 15px;
            pointer-events: auto;
            display: flex;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .inv-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .inv-title {
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .rarity-row {
            display: flex;
            gap: 6px;
        }
        .slot {
            width: 45px;
            height: 45px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .slot.petal-item {
            background: #FF5722;
            color: white;
            font-weight: bold;
            font-size: 11px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
        }

        /* KONTROLLER (SAĞ ALT - Mod ve Set Tuşları) */
        .controls-bottom-right {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.1s;
        }
        .ctrl-btn.small {
            width: 50px;
            height: 50px;
            font-size: 16px;
        }
        .ctrl-btn.large {
            width: 75px;
            height: 75px;
            font-size: 26px;
            background: rgba(76, 175, 80, 0.4);
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.4);
        }

        /* JOYSTICK (SOL ALT) */
        #joystick-base {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>
<body>

    <!-- ANA MENÜ -->
    <div id="menu-screen">
        <div class="title-container">
            <div class="slant-text-1">the game all custom petals in 1 game.</div>
            <div class="slant-text-2">be kind and just play.</div>
            <h1 class="game-title">U.İO</h1>
        </div>
        <button class="menu-btn" onclick="startGame()">Play / Sandbox</button>
        <button class="menu-btn settings" onclick="alert('Ayarlar yakında eklenecek!')">Ayarlar</button>
    </div>

    <!-- OYUN ALANI VE ARAYÜZ -->
    <div id="game-ui">
        <!-- Mavi Envanter Paneli -->
        <div id="inventory-panel">
            <div class="inv-section">
                <div class="inv-title">Rarity Tier List (3x Güç)</div>
                <div class="rarity-row" id="rarity-container"></div>
            </div>
            <div class="inv-section">
                <div class="inv-title">Equipped Slots (1-10)</div>
                <div class="rarity-row" id="slots-container"></div>
            </div>
        </div>

        <!-- Sol Alt Joystick -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <!-- Sağ Alt Mod ve Set Tuşları -->
        <div class="controls-bottom-right">
            <div class="ctrl-btn small" id="btn-off" onclick="setMode('offensive')" title="Offensive Mode">⚔️</div>
            <div class="ctrl-btn large" id="btn-norm" onclick="setMode('normal')" title="Normal Mode">A</div>
            <div class="ctrl-btn small" id="btn-def" onclick="setMode('defensive')" title="Defensive Mode">B</div>
            <div class="ctrl-btn small" id="btn-set" onclick="toggleSet()" title="2. Sete Geç">X</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // RARITY TANIMLARI
    const rarities = [
        { name: "Common", color: "#b0b0b0", mult: 1 },
        { name: "Unusual", color: "#55ff55", mult: 3 },
        { name: "Rare", color: "#5555ff", mult: 9 },
        { name: "Epic", color: "#aa00aa", mult: 27 },
        { name: "Mythic", color: "#ff5555", mult: 81 },
        { name: "Ultra", color: "#ffaa00", mult: 243 },
        { name: "Super", color: "#00ffff", mult: 729 },
        { name: "Eternal", color: "#ffffff", mult: 2187 },
        { name: "Unique", color: "#ff00ff", mult: 2187 }
    ];

    // OYUNCU DURUMU
    let player = {
        x: 0,
        y: 0,
        radius: 28,
        color: "#FFEB3B",
        speed: 4,
        mode: 'normal',
        activeSet: 1
    };

    // HARİTA VE TARGET DUMMİELER
    let dummies = [];
    function initDummies() {
        dummies = [];
        let startX = -600;
        for (let i = 0; i < rarities.length; i++) {
            dummies.push({
                x: startX + (i * 150),
                y: -200,
                radius: 35,
                color: "#9e9e9e",
                rarityIndex: i,
                totalDamage: 0,
                dps: 0,
                currentPeriodDamage: 0,
                lastDamageTime: 0
            });
        }
    }

    // ENVANTER VE SLOTLAR
    let inventoryPetals = [{ rarity: 0, name: "Basic" }];
    let equippedSlots = [0, null, null, null, null, null, null, null, null, null];

    function buildInventoryUI() {
        const rContainer = document.getElementById("rarity-container");
        rContainer.innerHTML = "";
        rarities.forEach((r, idx) => {
            let slot = document.createElement("div");
            slot.className = "slot";
            slot.style.borderColor = r.color;
            slot.title = r.name + " (x" + r.mult + " güç)";
            slot.innerHTML = `<span style="font-size:9px; color:${r.color}">${r.name[0]}</span>`;
            slot.onclick = () => {
                inventoryPetals.push({ rarity: idx, name: "Basic" });
                updateUI();
            };
            rContainer.appendChild(slot);
        });
        updateUI();
    }

    function updateUI() {
        const sContainer = document.getElementById("slots-container");
        sContainer.innerHTML = "";
        equippedSlots.forEach((slotItem, idx) => {
            let slotDiv = document.createElement("div");
            slotDiv.className = "slot";
            if (slotItem !== null) {
                slotDiv.classList.add("petal-item");
                slotDiv.style.background = rarities[slotItem.rarity].color;
                slotDiv.innerText = slotItem.name[0];
            }
            slotDiv.onclick = () => {
                if (slotItem === null && inventoryPetals.length > 0) {
                    equippedSlots[idx] = inventoryPetals.pop();
                } else if (slotItem !== null) {
                    inventoryPetals.push(slotItem);
                    equippedSlots[idx] = null;
                }
                updateUI();
            };
            sContainer.appendChild(slotDiv);
        });
    }

    // MOD YÖNETİMİ
    function setMode(newMode) {
        player.mode = newMode;
    }
    function toggleSet() {
        player.activeSet = player.activeSet === 1 ? 2 : 1;
        alert(player.activeSet + ". Sete Geçildi!");
    }

    // OYUNU BAŞLAT
    function startGame() {
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("game-ui").style.display = "block";
        player.x = 0;
        player.y = 200;
        initDummies();
        loop();
    }

    // KONTROLLER
    let keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };
    const stick = document.getElementById("joystick-stick");
    const jBase = document.getElementById("joystick-base");

    jBase.addEventListener('pointerdown', (e) => {
        joystickActive = true;
        updateJoystick(e);
    });
    window.addEventListener('pointermove', (e) => {
        if (joystickActive) updateJoystick(e);
    });
    window.addEventListener('pointerup', () => {
        joystickActive = false;
        joystickVector = { x: 0, y: 0 };
        stick.style.transform = `translate(0px, 0px)`;
    });

    function updateJoystick(e) {
        const rect = jBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let dx = e.clientX - centerX;
        let dy = e.clientY - centerY;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let maxDist = 40;

        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }

        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVector = { x: dx / maxDist, y: dy / maxDist };
    }

    let petalAngle = 0;

    // DPS SİSTEMİ
    setInterval(() => {
        let now = Date.now();
        dummies.forEach(d => {
            if (now - d.lastDamageTime > 15000) {
                d.totalDamage = 0;
                d.dps = 0;
                d.currentPeriodDamage = 0;
            } else {
                d.dps = Math.round(d.currentPeriodDamage / 5);
                d.currentPeriodDamage = 0;
            }
        });
    }, 5000);

    // OYUN DÖNGÜSÜ
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let moveX = 0;
        let moveY = 0;
        if (keys['w'] || keys['arrowup']) moveY -= 1;
        if (keys['s'] || keys['arrowdown']) moveY += 1;
        if (keys['a'] || keys['arrowleft']) moveX -= 1;
        if (keys['d'] || keys['arrowright']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            let len = Math.sqrt(moveX * moveX + moveY * moveY);
            player.x += (moveX / len) * player.speed;
            player.y += (moveY / len) * player.speed;
        }

        if (joystickVector.x !== 0 || joystickVector.y !== 0) {
            player.x += joystickVector.x * player.speed;
            player.y += joystickVector.y * player.speed;
        }

        let camX = canvas.width / 2 - player.x;
        let camY = canvas.height / 2 - player.y;

        ctx.save();
        ctx.translate(camX, camY);

        // Target Dummiler
        dummies.forEach(d => {
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
            ctx.fillStyle = d.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = rarities[d.rarityIndex].color;
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(d.x - 10, d.y - 5, 4, 0, Math.PI * 2);
            ctx.arc(d.x + 10, d.y - 5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${rarities[d.rarityIndex].name}`, d.x, d.y - 45);
            ctx.fillText(`Total: ${Math.round(d.totalDamage)}`, d.x, d.y + 50);
            ctx.fillText(`DPS: ${d.dps}`, d.x, d.y + 68);
        });

        // Petallar
        petalAngle += 0.04;
        equippedSlots.forEach((slot, i) => {
            if (slot === null) return;
            let angle = petalAngle + (i * (Math.PI * 2 / 10));
            let dist = 65;
            let pX = player.x + Math.cos(angle) * dist;
            let pY = player.y + Math.sin(angle) * dist;

            ctx.beginPath();
            ctx.arc(pX, pY, 12, 0, Math.PI * 2);
            ctx.fillStyle = rarities[slot.rarity].color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000";
            ctx.stroke();
            ctx.closePath();

            dummies.forEach(d => {
                let dx = pX - d.x;
                let dy = pY - d.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 12 + d.radius) {
                    let dmg = 10 * rarities[slot.rarity].mult;
                    d.totalDamage += dmg;
                    d.currentPeriodDamage += dmg;
                    d.lastDamageTime = Date.now();
                }
            });
        });

        // Oyuncu
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#FBC02D";
        ctx.stroke();
        ctx.closePath();

        // Gözler
        ctx.save();
        ctx.translate(player.x - 9, player.y - 4);
        ctx.beginPath();
        ctx.ellipse(0, 0, 4, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#000";
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(player.x + 9, player.y - 4);
        ctx.beginPath();
        ctx.ellipse(0, 0, 4, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#000";
        ctx.fill();
        ctx.restore();

        // Mod Kaşları
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2.5;
        if (player.mode === 'offensive') {
            ctx.beginPath();
            ctx.moveTo(player.x - 15, player.y - 14); ctx.lineTo(player.x - 3, player.y - 10);
            ctx.moveTo(player.x + 3, player.y - 10); ctx.lineTo(player.x + 15, player.y - 14);
            ctx.stroke();
        } else if (player.mode === 'defensive') {
            ctx.beginPath();
            ctx.moveTo(player.x - 15, player.y - 10); ctx.lineTo(player.x - 3, player.y - 14);
            ctx.moveTo(player.x + 3, player.y - 14); ctx.lineTo(player.x + 15, player.y - 10);
            ctx.stroke();
        }

        ctx.restore();

        requestAnimationFrame(loop);
    }

    buildInventoryUI();
</script>

</body>
  </html>
