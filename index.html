<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>U.io</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2b6e4f;font-family:sans-serif;color:#fff;overflow:hidden}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,0,0,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.12) 1px,transparent 1px);background-size:50px 50px}
.box{position:relative;text-align:center;padding:20px;width:100%;max-width:420px}
.orbit{position:relative;width:170px;height:170px;margin:0 auto 10px;animation:spin 7s linear infinite}
.me{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;background:#ffd84d;border:4px solid #b8962e;border-radius:50%}
.pt{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;border:3px solid rgba(0,0,0,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:72px;letter-spacing:2px;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.tag{margin:4px 0 22px;font-size:16px;color:#d6f5e4}
input{width:100%;max-width:260px;padding:12px 14px;font-size:18px;border:4px solid rgba(0,0,0,.35);border-radius:12px;text-align:center;outline:none}
.play{display:block;margin:16px auto 0;width:100%;max-width:260px;background:#3fbf7f;color:#fff;border:4px solid rgba(0,0,0,.35);border-radius:12px;padding:12px;font-size:26px;font-weight:bold;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.note{margin-top:18px;font-size:12px;color:#bde8d0}
</style></head><body>
<div class="grid"></div>
<div class="box">
  <div class="orbit">
    <div class="me"></div>
    <div class="pt" style="background:#fff;transform:rotate(0deg) translate(68px)"></div>
    <div class="pt" style="background:#ff6b6b;transform:rotate(72deg) translate(68px)"></div>
    <div class="pt" style="background:#4da3ff;transform:rotate(144deg) translate(68px)"></div>
    <div class="pt" style="background:#b36bff;transform:rotate(216deg) translate(68px)"></div>
    <div class="pt" style="background:#ffd84d;transform:rotate(288deg) translate(68px)"></div>
  </div>
  <h1>U.io</h1>
  <div class="tag">Collect petals. Survive. Grow.</div>
  <input id="nm" maxlength="14" placeholder="Your name" autocomplete="off">
  <a class="play" id="go" href="game.html">PLAY</a>
  <div class="note">Work in progress</div>
</div>
<script>
var nm=document.getElementById('nm');
try{nm.value=localStorage.getItem('uio_name')||''}catch(e){}
document.getElementById('go').addEventListener('click',function(){
  try{localStorage.setItem('uio_name',nm.value.trim())}catch(e){}
});
</script>
</body></html>
