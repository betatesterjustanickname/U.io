<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>U.io</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <h1>U.io</h1>
  <p>Petal &amp; mechanic testing ground</p>
  <button class="btn green" id="playBtn">Sandbox</button>
</div>

<div id="hud" class="hidden">
  <div id="topbar">
    <button class="btn" id="invBtn">Inventory</button>
    <button class="btn" id="resetBtn">Reset Stats</button>
    <button class="btn" id="menuBtn">Menu</button>
  </div>
  <div id="slots"></div>
</div>

<div id="inv" class="hidden">
  <div id="invbox">
    <div id="invhead"><span>Inventory</span><button class="btn" id="invClose">Close</button></div>
    <div id="tabs"></div>
    <div id="grid"></div>
    <div id="hint">Tap a petal to equip it. Tap an equipped slot to remove it.</div>
  </div>
</div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
<script src="draw.js"></script>
<script src="mobs.js"></script>
<script src="mobshapes.js"></script>
<script src="main.js"></script>
</body>
</html>
